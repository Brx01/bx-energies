<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX Energies | Safe & Accurate Cooking Gas Delivery in Amagba Axis, Amagba GRA, BIU & Benin City</title>
    <style>
        :root {
            --brand-blue: #0056D2;
            --brand-cyan: #00A8E8;
            --brand-green: #4ADE80;
            --brand-lime: #32D74B;
            --brand-gradient: linear-gradient(135deg, #0047AB 0%, #00A8E8 50%, #4ADE80 100%);
            --dark-bg: #0B132B;
            --light-bg: #F8FAFC;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Navigation */
        header {
            background: var(--white);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--brand-blue);
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 50px;
            background: rgba(50, 215, 75, 0.15);
            color: #15803D;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--brand-gradient);
            color: var(--white) !important;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 168, 232, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.4);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(180deg, #FFFFFF 0%, #EFF6FF 100%);
            padding: 60px 20px 80px;
            position: relative;
            overflow: hidden;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 50px;
            align-items: start;
        }

        .hero-text-block {
            padding-top: 20px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(0, 168, 232, 0.1);
            color: var(--brand-blue);
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 168, 232, 0.2);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
            color: var(--dark-bg);
        }

        .gradient-text {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--brand-blue);
            border: 2px solid var(--brand-blue);
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(0, 86, 210, 0.05);
        }

        /* Embedded Interactive Calculator Card */
        .calc-wrapper {
            background: var(--white);
            width: 100%;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 45px rgba(11, 19, 43, 0.1);
            border-top: 6px solid var(--brand-cyan);
        }

        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .calc-header h3 {
            font-size: 1.35rem;
            color: var(--dark-bg);
            font-weight: 800;
        }

        .rate-pill {
            background: rgba(50, 215, 75, 0.15);
            color: #15803D;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 5px 12px;
            border-radius: 50px;
        }

        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #F1F5F9;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 18px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--brand-blue);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .preset-btn {
            border: 1.5px solid #CBD5E1;
            background: var(--white);
            padding: 9px 5px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn.selected, .preset-btn:hover {
            border-color: var(--brand-cyan);
            background: rgba(0, 168, 232, 0.08);
            color: var(--brand-blue);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .input-box {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #CBD5E1;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: var(--brand-cyan);
        }

        .delivery-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .del-option {
            border: 1.5px solid #CBD5E1;
            border-radius: 12px;
            padding: 9px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .del-option.active {
            border-color: var(--brand-blue);
            background: rgba(0, 86, 210, 0.06);
            color: var(--brand-blue);
        }

        .addons-box {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .addons-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .addon-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            padding: 4px 0;
            cursor: pointer;
        }

        .addon-item input {
            margin-right: 8px;
            accent-color: var(--brand-blue);
            width: 15px;
            height: 15px;
        }

        .summary-panel {
            background: var(--dark-bg);
            color: var(--white);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            color: #CBD5E1;
            margin-bottom: 5px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1E293B;
            padding-top: 10px;
            margin-top: 8px;
        }
